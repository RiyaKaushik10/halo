name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-pytest \
            xvfb strace e2fsprogs btrfs-progs flake8
      - name: Lint
        run: flake8 halo helper/halo-helper tests
      - name: No-network source check
        run: python3 -m pytest -q tests/test_no_network.py
      - name: Tests in an empty network namespace
        run: sudo unshare -n xvfb-run -a python3 -m pytest -q
      - name: Network syscalls trace (only AF_UNIX allowed)
        run: |
          xvfb-run -a strace -f -e trace=network -o trace.txt python3 -m pytest -q tests || true
          ! grep -E 'AF_INET|AF_INET6|AF_PACKET' trace.txt
