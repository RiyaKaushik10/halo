name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts lintian python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 python3-pytest xvfb
      - name: Tests and no-network check
        run: sudo unshare -n xvfb-run -a python3 -m pytest -q
      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Lintian
        run: lintian --fail-on error ../halo_*_all.deb
      - name: Checksums
        run: |
          mkdir dist && cp ../halo_*_all.deb dist/
          cd dist && sha256sum halo_*_all.deb > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/halo_*_all.deb
            dist/SHA256SUMS
          body_path: notes.md
